name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  Integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-xdist pytest-timeout pytest-html

      - name: Install Playwright
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run tests
        run: |
          pytest -n 2 --timeout=600 \
            --junitxml=reports/junit.xml \
            --html=reports/report.html \
            --self-contained-html

      # Renders pass/fail results inline on the PR check — no download needed
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Playwright Tests
          path: reports/junit.xml
          reporter: java-junit

      # Full HTML report (includes screenshots on failure) as a downloadable artifact
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/