[pytest]
# Show a named PASSED/FAILED line per test instead of dots.
# --tb=short keeps failure tracebacks concise without losing context.
addopts = -v --tb=short

# Scope test discovery to the automationTesting folder.
testpaths = automationTesting

# ----------------------------------------------------------------------------
# Playwright debugging tips
# ----------------------------------------------------------------------------
#
# On any test failure a trace file is saved to testLogs/.
# Open it with the Playwright trace viewer:
#
#   playwright show-trace testLogs/trace_<test_name>.zip
#
# To run a single test with a visible browser window:
#
#   pytest -n 1 -k "test_name" --headed
#
# -n 1 keeps a single worker so the browser stays on screen long enough
# to observe. --headed is registered in conftest.py.